name: ci

# Runs on every push to main and every PR: build, the full Go test suite
# (compiles + executes real MFL programs natively — needs a C compiler and
# CGO enabled, unlike release.yml's cross-compiled CGO_ENABLED=0 binaries),
# and every non-server/non-GUI example as an integration smoke test.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install system deps (crypto + sqlite builtins link against these)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev

      - name: Build
        run: go build ./...

      # Install zig straight from ziglang.org, not mlugg/setup-zig: that action fetches
      # only from community mirrors, which lag the canonical site and were 404/503-ing for
      # every version. `zig cc` is clang-based and version-stable for the C->wasm smoke
      # build, so pin a widely-available stable (0.15.2).
      - name: Install zig (the C -> wasm compiler)
        run: |
          ZIG_VER=0.15.2
          curl -fsSL "https://ziglang.org/download/${ZIG_VER}/zig-x86_64-linux-${ZIG_VER}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p /tmp/zig && tar -xf /tmp/zig.tar.xz -C /tmp/zig --strip-components=1
          echo "/tmp/zig" >> "$GITHUB_PATH"

      # zig is installed ABOVE this step on purpose. The wasm and windows target
      # tests call zigPath() and `t.Skipf` when zig is missing — so with the install
      # below them they SKIPPED in CI, and a broken windows target shipped in
      # v0.122.0 and survived two releases while `TestWindowsNetCompiles` and
      # `TestWindowsBuildsPE` were red on every developer machine (#549, #517).
      - name: Test
        run: go test ./...

      # The MFL test suites — the ones written IN machin and run through the
      # `machin test` CLI, not the Go harness. Its own step so a failure here is
      # attributable to the framework module rather than to the compiler.
      #
      # framework/tests/flags_test.src previously sat in the repo executed by
      # nothing: the Go test that appears to cover flags.src writes its own inline
      # snippet instead. Its documented invocation had silently stopped working.
      - name: MFL test suites (machin test)
        run: |
          go build -o /tmp/machin-ci .
          /tmp/machin-ci test framework/flags.src framework/tests/flags_test.src
          /tmp/machin-ci test framework/bson.src framework/tests/bson_test.src
          /tmp/machin-ci test framework/xml.src framework/tests/xml_test.src
          /tmp/machin-ci test framework/reactive.src framework/tests/reactive_test.src
          /tmp/machin-ci test framework/reactive.src framework/router.src framework/tests/router_test.src

      # Coverage FLOOR, not a report: a ratchet set just under what the suites
      # measure today, so a regression fails here rather than being noticed later.
      # Raise it as #593 adds suites; lowering it must be deliberate and explained.
      - name: MFL coverage floor
        run: make mfl-cov-floor

      # The adversarial alias suite under AddressSanitizer (#578 step 2). It runs
      # as part of `go test ./...` above too, but it SKIPS when libasan is missing —
      # and a safety net that silently skips is not a net. This step runs it
      # explicitly and fails if it skipped, so the coverage is real.
      - name: Alias suite under AddressSanitizer
        run: |
          out=$(go test -count=1 -v -run TestAliasAdversarialUnderASan . 2>&1)
          echo "$out" | tail -25
          if echo "$out" | grep -q -- "--- SKIP"; then
            echo "::error::the ASan alias suite SKIPPED — libasan is missing on this runner, so the net is not actually running"
            exit 1
          fi
          echo "$out" | grep -q "^ok" || { echo "::error::ASan alias suite failed"; exit 1; }

      # main only: a release PR legitimately carries an untagged version bump, so
      # this would fail every such PR. On main it catches the version bump that
      # merged and never got tagged — the v0.123.0 failure, which was invisible.
      - name: Released-version check
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --tags --quiet
          make version-check

      # The README leads with "compiles itself — fixpoint". Nothing enforced that
      # claim until now: every selfhost/verify-*.sh was manual-only, and BOTH the
      # embedded prelude and the codegen had silently drifted from the Go
      # reference for an unknown number of commits (#625, #626).

      - name: Selfhost prelude is regenerated (#626)
        run: |
          python3 selfhost/gen-prelude.py
          if ! git diff --quiet selfhost/cgprelude.src; then
            echo "::error::selfhost/cgprelude.src is stale — the C runtime changed without re-running selfhost/gen-prelude.py. The self-hosted compiler embeds its OWN copy of the runtime, so a stale prelude means it builds programs against an OLDER runtime than the Go compiler does. Run: python3 selfhost/gen-prelude.py"
            git diff --stat selfhost/cgprelude.src
            exit 1
          fi
          echo "prelude matches the Go runtime"

      - name: Selfhost codegen oracle-diff (#625)
        run: |
          out=$(bash selfhost/verify-cgen.sh 2>&1)
          echo "$out" | tail -20
          echo "$out" | grep -q "FAIL 0" || {
            echo "::error::the self-hosted compiler emits different C than the Go reference. Either port the codegen change to selfhost/, or the two compilers build observably different programs."
            exit 1
          }

      - name: Selfhost fixpoint (#625)
        run: |
          out=$(bash selfhost/verify-fixpoint.sh 2>&1)
          echo "$out" | tail -12
          echo "$out" | grep -q "SELF-HOSTING FIXPOINT: PASS" || {
            echo "::error::the self-hosting fixpoint FAILED — the compiler no longer reproduces itself byte-for-byte, or its codegen diverged from the Go reference"
            exit 1
          }

      - name: Run every example (integration smoke test)
        run: ./examples/run.sh

      # Guard the wasm target: a POSIX-only helper (mmap, madvise, a <sys/*> include)
      # that lands in the always-on cRuntime compiles fine natively but breaks
      # `--target wasm` under a strict zig (wasi-libc has no mmap). This smoke build
      # fails CI if that regresses again. See issue #463.
      - name: wasm smoke build (guards POSIX-only code out of cRuntime — #463)
        run: |
          go build -o /tmp/machin .
          printf 'export func ping() (n) { n = 1 }\n' > /tmp/wasm_smoke.mfl
          /tmp/machin build /tmp/wasm_smoke.mfl --target wasm -o /tmp/wasm_smoke.wasm
          test -s /tmp/wasm_smoke.wasm && echo "wasm smoke build OK ($(wc -c < /tmp/wasm_smoke.wasm) bytes)"

      # Same guard for the windows target: a builtin whose emitted C calls a POSIX
      # function with no _WIN32 shim breaks `--target windows`. Exercises the file/dir
      # I/O family specifically — that is where the last two breakages were (#549).
      - name: windows smoke build (guards POSIX-only code out of the windows target — #517)
        run: |
          printf 'func main() {\n  p := "probe.txt"\n  write_file(p, "payload")\n  kind, size, mtime := stat(p)\n  sy := fsync(p)\n  n := len(list_dir("."))\n  remove(p)\n  println(str(kind) + str(size) + str(mtime) + str(sy) + str(n) + str(is_dir(".")))\n}\n' > /tmp/win_smoke.src
          /tmp/machin encode /tmp/win_smoke.src > /tmp/win_smoke.mfl
          /tmp/machin build /tmp/win_smoke.mfl --target windows -o /tmp/win_smoke.exe
          test -s /tmp/win_smoke.exe && echo "windows smoke build OK ($(wc -c < /tmp/win_smoke.exe) bytes)"

      # Cross-compile a SQLite program for Windows and hand it to a REAL Windows
      # runner below. Building a PE is not evidence it works: this target was
      # broken for two releases while CI happily compiled it (#549), because
      # nothing ever executed the result.
      - name: build the windows SQLite exe (for the run job)
        run: |
          printf 'func main() {\n    db := sqlite_open("ci.db")\n    sqlite_exec(db, "CREATE TABLE IF NOT EXISTS t(id INTEGER PRIMARY KEY, name TEXT)")\n    sqlite_exec(db, "DELETE FROM t")\n    sqlite_exec(db, "INSERT INTO t(name) VALUES(?)", []string{"windows"})\n    println(sqlite_query(db, "SELECT id,name FROM t"))\n    sqlite_close(db)\n}\n' > /tmp/win_sql.src
          /tmp/machin encode /tmp/win_sql.src > /tmp/win_sql.mfl
          /tmp/machin build /tmp/win_sql.mfl --target windows -o /tmp/win_sql.exe
          mkdir -p /tmp/winart && cp /tmp/win_sql.exe /tmp/winart/
          # zlib: same treatment — a vendored subset compiled in, so there is no
          # mingw libz for a user to find. Also executed on Windows below.
          printf 'func main() {\n    orig := "hello hello hello hello compress me compress me"\n    c := zlib_compress(bytes(orig), 6)\n    d := zlib_decompress(c)\n    println(str(len(bytes(orig))) + ":" + str(len(d)) + ":" + bytes_str(d))\n}\n' > /tmp/win_zlib.src
          /tmp/machin encode /tmp/win_zlib.src > /tmp/win_zlib.mfl
          /tmp/machin build /tmp/win_zlib.mfl --target windows -o /tmp/win_zlib.exe
          cp /tmp/win_zlib.exe /tmp/winart/
          # Concurrency: goroutines, channels and select. The windows target has
          # claimed these since the port landed, but every execution gate so far
          # (sqlite, zlib) is single-threaded, so winpthreads has never actually
          # been exercised on Windows. Deterministic by construction: the select
          # polls until the worker's send lands.
          printf 'func worker(ch) {\n    ch <- 42\n}\n\nfunc collect(ch, n) {\n    i := 0\n    total := 0\n    while i < n { total = total + <-ch  i = i + 1 }\n    return total\n}\n\nfunc main() {\n    a := make(chan int)\n    b := make(chan int)\n    go worker(a)\n    got := 0\n    select {\n    case v := <-a:\n        got = v\n    case v := <-b:\n        got = v + 1000\n    }\n    fan := make(chan int)\n    i := 0\n    while i < 8 { go worker(fan)  i = i + 1 }\n    println("select=" + str(got) + " fanin=" + str(collect(fan, 8)))\n}\n' > /tmp/win_conc.src
          /tmp/machin encode /tmp/win_conc.src > /tmp/win_conc.mfl
          /tmp/machin build /tmp/win_conc.mfl --target windows -o /tmp/win_conc.exe
          cp /tmp/win_conc.exe /tmp/winart/
          # Terminal raw mode: termios has no Windows equivalent, so this maps onto
          # SetConsoleMode + _kbhit/_getch (#517). CI has no interactive console,
          # but that is exactly the case worth pinning — OFF a tty both targets
          # must agree: raw_mode fails (-1) and read_key still returns at once.
          printf 'func main() {\n    r := raw_mode(1)\n    println("raw_mode=" + str(r))\n    k := read_key()\n    println("key=[" + k + "]")\n    raw_mode(0)\n    println("restored")\n}\n' > /tmp/win_tty.src
          /tmp/machin encode /tmp/win_tty.src > /tmp/win_tty.mfl
          /tmp/machin build /tmp/win_tty.mfl --target windows -o /tmp/win_tty.exe
          cp /tmp/win_tty.exe /tmp/winart/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exes
          path: /tmp/winart/
          retention-days: 1

  # Execute the cross-compiled binary on actual Windows. Compiling a PE proves
  # nothing about whether it runs — which is exactly how the windows target stayed
  # broken across two releases (#549, #517).
  windows-run:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-exes

      - name: run the cross-compiled SQLite binary
        shell: bash
        run: |
          set -euo pipefail
          out=$(./win_sql.exe)
          echo "output: $out"
          expected='[{"id":1,"name":"windows"}]'
          if [ "$out" != "$expected" ]; then
            echo "::error::windows SQLite binary produced $out, expected $expected"
            exit 1
          fi
          echo "SQLite works on Windows: bundled amalgamation, no external DLL"

      - name: run the cross-compiled zlib binary
        shell: bash
        run: |
          set -euo pipefail
          out=$(./win_zlib.exe)
          echo "output: $out"
          expected='47:47:hello hello hello hello compress me compress me'
          if [ "$out" != "$expected" ]; then
            echo "::error::windows zlib binary produced $out, expected $expected"
            exit 1
          fi
          echo "zlib works on Windows: vendored deflate/inflate, no external libz"

      - name: run the cross-compiled concurrency binary (goroutines + channels + select)
        shell: bash
        run: |
          set -euo pipefail
          out=$(./win_conc.exe)
          echo "output: $out"
          expected='select=42 fanin=336'
          if [ "$out" != "$expected" ]; then
            echo "::error::windows concurrency binary produced $out, expected $expected"
            exit 1
          fi
          echo "goroutines, channels and select work on Windows (winpthreads)"

      - name: run the cross-compiled raw-mode binary (console API, off a tty)
        shell: bash
        run: |
          set -euo pipefail
          # Same two stdin shapes TestTTYOffATtyContract pins on POSIX. Windows
          # stdio translates \n to \r\n in text mode, which is a line-ending
          # convention rather than part of the raw_mode contract, so \r is
          # stripped before comparing. The raw bytes are dumped first so a real
          # difference can never hide behind that normalisation.
          check() {
            printf '%s' "$2" | ./win_tty.exe > /tmp/tty_out.txt
            echo "--- $1: raw bytes ---"
            od -c /tmp/tty_out.txt | head -5
            got=$(tr -d '\r' < /tmp/tty_out.txt)
            if [ "$got" != "$3" ]; then
              echo "::error::windows raw_mode/read_key ($1) produced [$got], expected [$3]"
              exit 1
            fi
            echo "--- $1: matches the POSIX contract ---"
          }
          check "empty stdin"      ""  "$(printf 'raw_mode=-1\nkey=[]\nrestored')"
          check "one byte waiting" "Z" "$(printf 'raw_mode=-1\nkey=[Z]\nrestored')"
          echo "raw_mode/read_key match the POSIX contract off a tty, and read_key never blocked"
